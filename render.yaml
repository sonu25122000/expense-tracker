services:
  - type: web
    name: expense-tracker
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
